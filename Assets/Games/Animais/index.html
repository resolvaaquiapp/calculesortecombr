<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sombra dos Amigos</title>
<style>
body { background-color: #FFF5F5; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
h1 { color: #FC8181; font-size: 2rem; margin-bottom: 20px; }
.shadow-box { width: 160px; height: 160px; background: #E2E8F0; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 6rem; filter: brightness(0) opacity(0.3); margin-bottom: 30px; transition: all 0.5s; }
.choices { display: flex; gap: 25px; }
.choice { width: 120px; height: 120px; background: #fff; border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 4rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s; border: 3px solid transparent; }
.choice:hover { transform: translateY(-5px); }
.choice.correct { border-color: #68D391; background: #F0FFF4; }
.msg { margin-top: 25px; font-size: 1.5rem; color: #718096; }
</style>
</head>
<body>
<h1>Qual animal é este?</h1>
<div class="shadow-box" id="shadow">🐶</div>
<div class="choices" id="choices"></div>
<div class="msg" id="msg"></div>

<script>
const animals = ['🐶', '🐱', '', '🦁', '', '🐼'];
let currentAnimal = '';

function newRound() {
    currentAnimal = animals[Math.floor(Math.random() * animals.length)];
    document.getElementById('shadow').textContent = currentAnimal;
    document.getElementById('msg').textContent = '';
    
    const container = document.getElementById('choices');
    container.innerHTML = '';
    
    const opts = [...animals].sort(() => 0.5 - Math.random()).slice(0, 3);
    if (!opts.includes(currentAnimal)) opts[0] = currentAnimal;
    opts.sort(() => 0.5 - Math.random());

    opts.forEach(a => {
        const div = document.createElement('div');
        div.className = 'choice';
        div.textContent = a;
        div.onclick = () => check(a, div);
        container.appendChild(div);
    });
}

function check(animal, el) {
    if (animal === currentAnimal) {
        el.classList.add('correct');
        document.getElementById('shadow').style.filter = 'none'; // Revela a cor
        document.getElementById('msg').textContent = 'Achou o amigo!';
        setTimeout(() => {
            document.getElementById('shadow').style.filter = 'brightness(0) opacity(0.3)';
            newRound();
        }, 2000);
    }
}
newRound();
</script>
</body>
</html>
